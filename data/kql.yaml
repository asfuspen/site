# Biblioteca de consultas KQL. Campos: id, titulo, title_en, descricao, desc_en, produto, tabela, tags, mitre, query.
# mitre: lista de { tatica: "TA....", tecnica: "T....", nome: "nome oficial em inglês" }, usada no mapa ATT&CK.
- id: "falhas-login-usuario-ip"
  titulo: "Falhas de login por usuário e IP"
  title_en: "Failed sign-ins by user and IP"
  descricao: "Lista as combinações de conta e endereço IP com mais falhas de autenticação nas últimas 24 horas."
  desc_en: "Lists the account and IP address pairs with the most authentication failures in the last 24 hours."
  produto: "Sentinel"
  tabela: "SigninLogs"
  tags: ["identidade", "entra id"]
  mitre:
    - { tatica: "TA0006", tecnica: "T1110", nome: "Brute Force" }
  query: |
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where ResultType != "0"
    | summarize Failures = count() by UserPrincipalName, IPAddress
    | top 20 by Failures desc
- id: "password-spray"
  titulo: "Possível password spray"
  title_en: "Possible password spray"
  descricao: "Encontra endereços IP que falharam o login em muitas contas diferentes dentro da mesma hora."
  desc_en: "Finds IP addresses that failed to sign in to many different accounts within the same hour."
  produto: "Sentinel"
  tabela: "SigninLogs"
  tags: ["identidade", "força bruta"]
  mitre:
    - { tatica: "TA0006", tecnica: "T1110.003", nome: "Password Spraying" }
  query: |
    SigninLogs
    | where TimeGenerated > ago(1d)
    | where ResultType in ("50126", "50053")
    | summarize Users = dcount(UserPrincipalName), Attempts = count()
        by IPAddress, bin(TimeGenerated, 1h)
    | where Users >= 10
    | order by Users desc
- id: "login-apos-spray"
  titulo: "Logins concluídos ou barrados no MFA a partir de IPs com spray"
  title_en: "Sign-ins completed or stopped at MFA from spraying IPs"
  descricao: "Parte dos IPs com falhas em muitas contas e lista os logins desses IPs que tiveram sucesso ou pararam na exigência de MFA, para separar as contas que precisam de atenção imediata."
  desc_en: "Starts from the IPs failing on many accounts and lists their sign-ins that succeeded or stopped at the MFA requirement, to single out the accounts that need immediate attention."
  produto: "Sentinel"
  tabela: "SigninLogs"
  tags: ["identidade", "força bruta"]
  mitre:
    - { tatica: "TA0006", tecnica: "T1110.003", nome: "Password Spraying" }
  query: |
    let SuspectIPs = SigninLogs
        | where TimeGenerated > ago(1d)
        | where ResultType in ("50126", "50053")
        | summarize Users = dcount(UserPrincipalName) by IPAddress, bin(TimeGenerated, 1h)
        | where Users >= 10
        | distinct IPAddress;
    SigninLogs
    | where TimeGenerated > ago(1d)
    | where IPAddress in (SuspectIPs)
    | where ResultType in ("0", "50074", "50076")
    | project TimeGenerated, UserPrincipalName, IPAddress, ResultType, ResultDescription, AppDisplayName
    | order by TimeGenerated asc
- id: "autenticacao-legada"
  titulo: "Logins por tipo de cliente, para achar autenticação legada"
  title_en: "Sign-ins by client app, to find legacy authentication"
  descricao: "Conta os logins bem-sucedidos por tipo de cliente. Procure no resultado os clientes de autenticação legada, como Exchange ActiveSync, IMAP4, POP3 e SMTP, candidatos a bloqueio por acesso condicional."
  desc_en: "Counts successful sign-ins by client app. Look in the result for legacy authentication clients such as Exchange ActiveSync, IMAP4, POP3 and SMTP, candidates for a Conditional Access block."
  produto: "Sentinel"
  tabela: "SigninLogs"
  tags: ["identidade", "acesso condicional"]
  mitre:
    - { tatica: "TA0001", tecnica: "T1078", nome: "Valid Accounts" }
  query: |
    SigninLogs
    | where TimeGenerated > ago(7d)
    | where ResultType == "0"
    | summarize Logins = count(), Users = dcount(UserPrincipalName) by ClientAppUsed
    | order by Logins desc
- id: "novos-membros-em-funcoes"
  titulo: "Novos membros em funções administrativas"
  title_en: "New members added to admin roles"
  descricao: "Audita quem adicionou quem a uma função do Entra ID nos últimos 7 dias."
  desc_en: "Audits who added whom to an Entra ID role in the last 7 days."
  produto: "Sentinel"
  tabela: "AuditLogs"
  tags: ["identidade", "privilégio"]
  mitre:
    - { tatica: "TA0003", tecnica: "T1098.003", nome: "Additional Cloud Roles" }
    - { tatica: "TA0004", tecnica: "T1098.003", nome: "Additional Cloud Roles" }
  query: |
    AuditLogs
    | where TimeGenerated > ago(7d)
    | where OperationName == "Add member to role"
    | extend Actor = tostring(InitiatedBy.user.userPrincipalName)
    | mv-apply Resource = TargetResources on (
        where Resource.type in~ ("User", "ServicePrincipal")
        | extend Target = iff(Resource.type =~ "ServicePrincipal",
            tostring(Resource.displayName), tostring(Resource.userPrincipalName)),
            Properties = Resource.modifiedProperties
      )
    | mv-apply Property = Properties on (
        where Property.displayName =~ "Role.DisplayName"
        | extend Role = trim('"', tostring(Property.newValue))
      )
    | project TimeGenerated, Actor, Target, Role, Result
    | order by TimeGenerated desc
- id: "regras-encaminhamento-caixa"
  titulo: "Regras de encaminhamento em caixas de correio"
  title_en: "Mailbox forwarding rules"
  descricao: "Detecta criação ou alteração de regras de caixa de entrada que encaminham ou redirecionam mensagens, técnica comum após comprometimento de conta."
  desc_en: "Detects inbox rules created or changed to forward or redirect messages, a common technique after account compromise."
  produto: "Sentinel"
  tabela: "OfficeActivity"
  tags: ["e-mail", "exfiltração"]
  mitre:
    - { tatica: "TA0009", tecnica: "T1114.003", nome: "Email Forwarding Rule" }
  query: |
    OfficeActivity
    | where TimeGenerated > ago(7d)
    | where Operation in ("New-InboxRule", "Set-InboxRule")
    | where Parameters has_any ("ForwardTo", "RedirectTo")
    | project TimeGenerated, UserId, ClientIP, Operation, Parameters
    | order by TimeGenerated desc
- id: "encaminhamento-externo"
  titulo: "Encaminhamento de e-mail para fora da organização"
  title_en: "Email forwarding outside the organization"
  descricao: "Extrai o destino de regras de caixa de entrada e de encaminhamentos de caixa e mantém só os que ficam fora dos domínios informados em InternalDomains. Troque contoso.com pelos seus domínios."
  desc_en: "Extracts the destination of inbox rules and mailbox forwarding and keeps only those outside the domains listed in InternalDomains. Replace contoso.com with your domains."
  produto: "Sentinel"
  tabela: "OfficeActivity"
  tags: ["e-mail", "exfiltração"]
  mitre:
    - { tatica: "TA0009", tecnica: "T1114.003", nome: "Email Forwarding Rule" }
  query: |
    let InternalDomains = dynamic(["contoso.com"]);
    OfficeActivity
    | where TimeGenerated > ago(7d)
    | where OfficeWorkload =~ "Exchange"
    | where Operation in ("New-InboxRule", "Set-InboxRule", "Set-Mailbox")
    | where Parameters has_any ("ForwardTo", "RedirectTo", "ForwardAsAttachmentTo", "ForwardingSmtpAddress")
    | mv-apply Parameter = todynamic(Parameters) on (
        summarize Parsed = make_bag(bag_pack(tostring(Parameter.Name), Parameter.Value))
      )
    | extend Destination = tolower(tostring(coalesce(
        Parsed.ForwardTo, Parsed.RedirectTo, Parsed.ForwardAsAttachmentTo, Parsed.ForwardingSmtpAddress)))
    | extend Destination = trim_start(@"smtp:", Destination)
    | where isnotempty(Destination)
    | mv-expand Target = split(Destination, ";") to typeof(string)
    | extend TargetDomain = tostring(split(Target, "@")[1])
    | where TargetDomain !in (InternalDomains)
    | project TimeGenerated, UserId, ClientIP, Operation, Target, Parameters
    | order by TimeGenerated desc
- id: "regras-que-escondem-mensagens"
  titulo: "Regras de caixa de entrada que escondem mensagens"
  title_en: "Inbox rules that hide messages"
  descricao: "Encontra regras que apagam, movem ou marcam mensagens como lidas e que filtram por palavras de alerta ou não têm filtro nenhum."
  desc_en: "Finds rules that delete, move or mark messages as read and that filter on alert words or have no filter at all."
  produto: "Sentinel"
  tabela: "OfficeActivity"
  tags: ["e-mail", "furtividade"]
  mitre:
    - { tatica: "TA0005", tecnica: "T1564.008", nome: "Email Hiding Rules" }
  query: |
    let Keywords = dynamic(["phishing", "spam", "suspicious", "malicious", "hijacked", "helpdesk"]);
    OfficeActivity
    | where TimeGenerated > ago(7d)
    | where OfficeWorkload =~ "Exchange"
    | where Operation in ("New-InboxRule", "Set-InboxRule")
    | where Parameters has_any ("DeleteMessage", "MoveToFolder", "MarkAsRead")
    | extend HasFilter = Parameters has_any ("SubjectContainsWords", "BodyContainsWords", "SubjectOrBodyContainsWords")
    | extend HasAlertKeyword = Parameters has_any (Keywords)
    | where HasAlertKeyword or not(HasFilter)
    | project TimeGenerated, UserId, ClientIP, Operation, HasFilter, HasAlertKeyword, Parameters
    | order by TimeGenerated desc
- id: "powershell-codificado"
  titulo: "PowerShell com comando codificado"
  title_en: "PowerShell with encoded command"
  descricao: "Localiza execuções de PowerShell com comando em Base64, usado com frequência para ocultar a intenção do script."
  desc_en: "Finds PowerShell executions with a Base64 command, often used to hide what the script does."
  produto: "Defender XDR"
  tabela: "DeviceProcessEvents"
  tags: ["endpoint", "execução"]
  mitre:
    - { tatica: "TA0002", tecnica: "T1059.001", nome: "PowerShell" }
    - { tatica: "TA0005", tecnica: "T1027", nome: "Obfuscated Files or Information" }
  query: |
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where FileName in~ ("powershell.exe", "pwsh.exe")
    | where ProcessCommandLine contains "-enc"
        or ProcessCommandLine contains "FromBase64String"
    | project Timestamp, DeviceName, AccountName, ProcessCommandLine, InitiatingProcessFileName
    | order by Timestamp desc
- id: "office-iniciando-scripts"
  titulo: "Aplicativos do Office iniciando interpretadores"
  title_en: "Office apps spawning script interpreters"
  descricao: "Mostra Word, Excel, PowerPoint ou Outlook iniciando shells e interpretadores de script, comportamento compatível com a abertura de um arquivo malicioso. A consulta não indica como o arquivo chegou ao usuário."
  desc_en: "Shows Word, Excel, PowerPoint or Outlook launching shells and script interpreters, behavior consistent with a malicious file being opened. The query does not show how the file reached the user."
  produto: "Defender XDR"
  tabela: "DeviceProcessEvents"
  tags: ["endpoint", "execução"]
  mitre:
    - { tatica: "TA0002", tecnica: "T1204.002", nome: "Malicious File" }
  query: |
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where InitiatingProcessFileName in~ ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe")
    | where FileName in~ ("powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe")
    | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine
    | order by Timestamp desc
- id: "phishing-entregue"
  titulo: "Phishing entregue na caixa de entrada"
  title_en: "Phishing delivered to the inbox"
  descricao: "Conta as mensagens classificadas como phishing que mesmo assim foram entregues na caixa de entrada ou em uma pasta do usuário, por destinatário e domínio remetente."
  desc_en: "Counts messages classified as phishing that were still delivered to the inbox or a user folder, by recipient and sender domain."
  produto: "Defender XDR"
  tabela: "EmailEvents"
  tags: ["e-mail", "phishing"]
  mitre:
    - { tatica: "TA0001", tecnica: "T1566", nome: "Phishing" }
  query: |
    EmailEvents
    | where Timestamp > ago(7d)
    | where ThreatTypes has "Phish"
    | where DeliveryAction == "Delivered"
    | where DeliveryLocation == "Inbox/Folder"
    | summarize Messages = count() by RecipientEmailAddress, SenderFromDomain
    | order by Messages desc
- id: "impacto-regras-asr-auditoria"
  titulo: "Impacto das regras ASR em modo auditoria"
  title_en: "Impact of ASR rules in audit mode"
  descricao: "Agrupa os eventos de regras ASR em auditoria dos últimos 30 dias por regra e processo de origem, para decidir o que pode ir para bloqueio e o que precisa de exclusão."
  desc_en: "Groups audit-mode ASR rule events from the last 30 days by rule and initiating process, to decide what can move to block and what needs an exclusion."
  produto: "Defender XDR"
  tabela: "DeviceEvents"
  tags: ["endpoint", "asr", "hardening"]
  mitre:
    - { tatica: "TA0006", tecnica: "T1003.001", nome: "LSASS Memory" }
    - { tatica: "TA0003", tecnica: "T1546.003", nome: "Windows Management Instrumentation Event Subscription" }
  query: |
    DeviceEvents
    | where Timestamp > ago(30d)
    | where ActionType startswith "Asr" and ActionType endswith "Audited"
    | summarize Events = count(), Devices = dcount(DeviceName),
        SampleFiles = make_set(FileName, 5), SampleFolders = make_set(FolderPath, 5)
        by ActionType, InitiatingProcessFileName
    | order by Events desc
