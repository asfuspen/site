<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body data-index="{{ "index.json" | relLangURL }}" data-t="{{ dict "copy" (T "copy") "copied" (T "copied") "code" (T "code") "none" (T "search_none") "loading" (T "loading") "linkCopied" (T "link_copied") | jsonify }}">
  <a class="skip" href="#conteudo">{{ T "skip" }}</a>
  <div class="progress" aria-hidden="true"><span></span></div>
  {{ partial "header.html" . }}
  <main id="conteudo">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "palette.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
