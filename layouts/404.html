{{ define "main" }}
<section class="hero">
  <div class="wrap">
    <div class="board nf">
      <p class="board-label mono">{{ T "not_found" }}</p>
      <div class="flap" role="img" aria-label="404">{{ range split "   404   " "" }}<span>{{ if eq . " " }}&nbsp;{{ else }}{{ . }}{{ end }}</span>{{ end }}</div>
      <h1>{{ T "nf_title" }}</h1>
      <div class="cta">
        <a class="btn primary" href="{{ site.Home.RelPermalink }}">{{ T "home" }}</a>
        <a class="btn" href="{{ "posts/" | relLangURL }}">{{ T "read_blog" }}</a>
        <button class="btn" type="button" data-open-palette>{{ T "search_site" }}</button>
      </div>
    </div>
  </div>
</section>
{{ end }}
