<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Página inicial">
      <span class="brand-mark">{{ partial "icon.html" "shield" }}</span>
      <span class="brand-name">alessandro<b>ferreira</b></span>
    </a>
    <nav class="nav" aria-label="Principal">
      {{ $cur := . }}
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="tools">
      <button class="kbtn" type="button" data-open-palette aria-label="Buscar no site">
        {{ partial "icon.html" "search" }}<span>Buscar</span><kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" type="button" data-toggle-theme aria-label="Alternar tema claro e escuro">{{ partial "icon.html" "theme" }}</button>
    </div>
  </div>
</header>
