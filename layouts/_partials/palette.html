<div class="palette" hidden role="dialog" aria-modal="true" aria-label="{{ T "search_site" }}">
  <div class="palette-box">
    <div class="palette-input">
      <span class="mono prompt">&gt;</span>
      <input type="text" placeholder="{{ T "search_placeholder" }}" autocomplete="off" spellcheck="false" aria-label="{{ T "search" }}">
      <kbd>Esc</kbd>
    </div>
    <ul class="palette-list" role="listbox"></ul>
    <p class="palette-hint mono">{{ T "search_hint" }}</p>
  </div>
</div>
