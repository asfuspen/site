<article class="card reveal">
  <a class="card-link" href="{{ .RelPermalink }}">
    <div class="card-top mono">
      <span class="tag-cat">{{ with index (.Params.categories | default (slice "Artigo")) 0 }}{{ . }}{{ end }}</span>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "02 Jan 2006" }}</time>
    </div>
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.summary | default .Summary | plainify | truncate 150 }}</p>
    <div class="card-foot mono">
      <span>{{ .ReadingTime }} min de leitura</span>
      <span class="go">ler {{ partial "icon.html" "arrow" }}</span>
    </div>
  </a>
</article>
